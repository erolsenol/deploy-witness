name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@^11.15.0
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - run: npm ci
      - run: npm run lint
      - run: npm run schema:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Ensure the Action bundle is committed
        run: git diff --exit-code -- dist/action-bundle/index.js
      - run: npm pack --dry-run
      - name: Publish with npm Trusted Publishing and provenance
        run: npm publish --provenance --access public
