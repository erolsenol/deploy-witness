name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@^11.15.0
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - run: npm ci
      - run: npm run lint
      - run: npm run schema:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Ensure the Action bundle is committed
        run: git diff --exit-code -- dist/action-bundle/index.js
      - run: npm pack --dry-run
      - name: Publish with npm Trusted Publishing and provenance
        run: npm publish --provenance --access public
      - name: Wait for registry visibility and verify provenance
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          package_version="${PACKAGE_VERSION#v}"
          version_file="$RUNNER_TEMP/deploy-witness-registry-version.txt"
          for attempt in {1..48}; do
            if npm view "deploy-witness@${package_version}" version --json > "$version_file" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 48 ]; then
              echo "::error::deploy-witness@${package_version} did not become visible in npm after 8 minutes."
              exit 1
            fi
            sleep 10
          done
          test "$(cat "$version_file")" = "\"${package_version}\""
          npm view "deploy-witness@${package_version}" dist.integrity dist.attestations --json > "$RUNNER_TEMP/deploy-witness-registry-metadata.json"
          node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!metadata.dist?.integrity) throw new Error("Published package has no registry integrity value.");
            if (metadata.dist?.attestations?.provenance?.predicateType !== "https://slsa.dev/provenance/v1") {
              throw new Error("Published package SLSA provenance is missing from npm metadata.");
            }
          ' "$RUNNER_TEMP/deploy-witness-registry-metadata.json"
      - name: Smoke-test the published registry package
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          package_version="${PACKAGE_VERSION#v}"
          consumer_dir="$RUNNER_TEMP/deploy-witness-consumer"
          npm install --prefix "$consumer_dir" --no-save --no-audit --no-fund "deploy-witness@${package_version}"
          test "$("$consumer_dir/node_modules/.bin/deploy-witness" --version)" = "$package_version"
          "$consumer_dir/node_modules/.bin/deploy-witness" schema config-v2 > /dev/null
